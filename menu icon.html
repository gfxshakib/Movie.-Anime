<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Mod Apps - Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #00f2ea;
        --secondary: #ff0050;
        --bg-dark: #090910;
        --card-bg: rgba(255, 255, 255, 0.03);
        --text-main: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.12) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(255, 0, 80, 0.12) 0%, transparent 40%);
        color: var(--text-main);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    .header {
        width: 100%;
        max-width: 400px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        background: var(--card-bg);
        padding: 15px 20px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(15px);
    }
    .back-btn {
        color: var(--primary);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
    }
    .back-btn:hover { opacity: 0.8; }
    .header h3 { font-size: 16px; color: #fff; }

    .app-list {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .app-item {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 15px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        backdrop-filter: blur(15px);
        transition: 0.3s;
    }
    .app-item:hover {
        border-color: rgba(0, 242, 234, 0.3);
        transform: translateY(-2px);
    }
    .app-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .app-img {
        width: 55px;
        height: 55px;
        border-radius: 14px;
        object-fit: cover;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .app-details h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .app-details p { font-size: 12px; color: #aaa; }
    
    .get-btn {
        background: linear-gradient(135deg, #00f2ea, #00c6fb);
        color: #000;
        padding: 8px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(0, 242, 234, 0.2);
        transition: 0.3s;
    }
    .get-btn:hover {
        transform: scale(1.05);
    }
</style>
</head>
<body>

    <div class="header">
        <a href="New File.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <h3><i class="fas fa-store" style="color: var(--primary);"></i> Mod Apps Store</h3>
    </div>

    <div class="app-list">
        <!-- ১. CapCut Pro -->
        <div class="app-item">
            <div class="app-info">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Capcut_logo.jpg" class="app-img" alt="CapCut">
                <div class="app-details">
                    <h3>CapCut Pro</h3>
                    <p>Video Editor • 180MB</p>
                </div>
            </div>
            <a href="New File.html" class="get-btn">Get</a>
        </div>

        <!-- ২. KineMaster Pro -->
        <div class="app-item">
            <div class="app-info">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=120&q=80" class="app-img" alt="KineMaster">
                <div class="app-details">
                    <h3>KineMaster Pro</h3>
                    <p>Pro Editor • 95MB</p>
                </div>
            </div>
            <a href="https://play.google.com/store/apps/details?id=com.nexstreaming.app.kinemasterfree" target="_blank" class="get-btn">Get</a>
        </div>

        <!-- ৩. Alight Motion -->
        <div class="app-item">
            <div class="app-info">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=120&q=80" class="app-img" alt="Alight Motion">
                <div class="app-details">
                    <h3>Alight Motion</h3>
                    <p>VFX & Animation • 120MB</p>
                </div>
            </div>
            <a href="https://play.google.com/store/apps/details?id=com.alightcreative.motion" target="_blank" class="get-btn">Get</a>
        </div>

        <!-- ৪. Lightroom Pro -->
        <div class="app-item">
            <div class="app-info">
                <img src="https://images.unsplash.com/photo-1542744094-3a3124626d0d?auto=format&fit=crop&w=120&q=80" class="app-img" alt="Lightroom">
                <div class="app-details">
                    <h3>Lightroom Pro</h3>
                    <p>Photo Editor • 110MB</p>
                </div>
            </div>
            <a href="https://play.google.com/store/apps/details?id=com.adobe.lrmobile" target="_blank" class="get-btn">Get</a>
        </div>
    </div>

</body>
</html>
